repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check sagaflow tests
        language: system
        types: [python]
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: mypy sagaflow
        language: system
        types: [python]
        pass_filenames: false
      - id: lint-test-stubs
        name: lint test stubs (catches tests stubbing the unit-under-test)
        entry: python tools/lint_test_stubs.py tests
        language: system
        types: [python]
        pass_filenames: false
        files: ^tests/.*\.py$
