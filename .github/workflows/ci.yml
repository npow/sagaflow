name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: python:3.11
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: npow/claude-skills
          path: .claude-skills
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check sagaflow tests
      - name: Type-check
        run: mypy sagaflow
      - name: Test
        id: test
        continue-on-error: true
        timeout-minutes: 5
        env:
          CLAUDE_SKILLS_DIR: ${{ github.workspace }}/.claude-skills
        run: |
          trap '' TERM
          pip uninstall -y temporalio
          pytest -v --junitxml=/tmp/results.xml \
            --ignore=tests/generic --ignore=tests/scenarios --ignore=tests/skills \
            --ignore=tests/test_intervention.py \
            -k "not TestWorkflowAbortSignal and not TestWorkflowStatusQuery and not test_all_activities_dedupes_by_temporal_activity_name"
          exit $?
      - name: Verify tests passed
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET, sys
          root = ET.parse('/tmp/results.xml').getroot()
          # xunit2 (pytest 9+): root=<testsuites>, counts on child <testsuite>
          if root.tag == 'testsuites':
              ts = root.find('testsuite')
              if ts is None: print('No testsuite element'); sys.exit(1)
          else:
              ts = root
          f, e, t = int(ts.get('failures',0)), int(ts.get('errors',0)), int(ts.get('tests',0))
          if t == 0: print('No tests recorded'); sys.exit(1)
          if f + e > 0: print(f'FAILED: {f} failures, {e} errors / {t}'); sys.exit(1)
          print(f'OK: {t} tests passed')
          "
