name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: npow/claude-skills
          path: .claude-skills
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check sagaflow tests
      - name: Type-check
        run: mypy sagaflow
      - name: Test
        id: tests
        continue-on-error: true
        timeout-minutes: 5
        env:
          CLAUDE_SKILLS_DIR: ${{ github.workspace }}/.claude-skills
        run: |
          pytest -v --tb=short \
            --ignore=tests/generic --ignore=tests/scenarios --ignore=tests/skills \
            -k "not TestWorkflowAbortSignal and not TestWorkflowStatusQuery" \
            2>&1 | tee /tmp/test-output.txt
          echo "PYTEST_RC=${PIPESTATUS[0]}" | tee -a /tmp/test-output.txt
      - name: Verify test results
        if: always()
        run: |
          if [ "${{ steps.tests.outcome }}" = "success" ]; then
            echo "Tests passed"
            exit 0
          fi
          # Step failed or was canceled — check actual test results
          if grep -q "PYTEST_RC=0" /tmp/test-output.txt 2>/dev/null; then
            echo "Tests passed (step was killed during process cleanup)"
            exit 0
          fi
          if grep -qP "\d+ passed" /tmp/test-output.txt 2>/dev/null && \
             ! grep -q "FAILED" /tmp/test-output.txt 2>/dev/null; then
            echo "All executed tests passed (process killed before summary)"
            exit 0
          fi
          echo "Tests failed:"
          grep "FAILED" /tmp/test-output.txt 2>/dev/null || echo "(no output captured)"
          exit 1
