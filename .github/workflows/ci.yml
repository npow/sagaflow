name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: python:3.11
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: npow/claude-skills
          path: .claude-skills
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check sagaflow tests
      - name: Type-check
        run: mypy sagaflow
      - name: Test
        id: test
        continue-on-error: true
        timeout-minutes: 5
        env:
          CLAUDE_SKILLS_DIR: ${{ github.workspace }}/.claude-skills
        run: |
          pip uninstall -y temporalio
          pytest -v \
            --ignore=tests/generic --ignore=tests/scenarios --ignore=tests/skills \
            -k "not TestWorkflowAbortSignal and not TestWorkflowStatusQuery and not test_all_activities_dedupes_by_temporal_activity_name" \
          && touch /tmp/.tests_passed
      - name: Verify tests passed
        run: test -f /tmp/.tests_passed
