name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: npow/claude-skills
          path: .claude-skills
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check sagaflow tests
      - name: Type-check
        run: mypy sagaflow
      - name: Test
        timeout-minutes: 5
        env:
          RUNNER_TRACKING_ID: ""
          CLAUDE_SKILLS_DIR: ${{ github.workspace }}/.claude-skills
        run: |
          pip uninstall -y temporalio
          set +e
          pytest -v \
            --ignore=tests/generic --ignore=tests/scenarios --ignore=tests/skills \
            -k "not TestWorkflowAbortSignal and not TestWorkflowStatusQuery and not test_all_activities_dedupes_by_temporal_activity_name"
          PYTEST_RC=$?
          set -e
          # Kill straggler child processes before the runner detects them as orphans
          pkill -P $$ 2>/dev/null || true
          sleep 1
          exit $PYTEST_RC
